version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"            # folder containing package.json (e.g. "/api" if nested)
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/"            # folder containing the Dockerfile
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"            # always "/" for workflows
    schedule:
      interval: "weekly"
