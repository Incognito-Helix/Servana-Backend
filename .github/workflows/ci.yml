name: Backend CI

on:
  pull_request:
    branches: [staging, main]

jobs:
  backend-ci:
    name: Backend CI - Lint, test, and validate backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=high
